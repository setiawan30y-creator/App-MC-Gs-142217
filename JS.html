<script>const MENU=[['dashboard','Dashboard'],['teller','Teller Workspace'],['customers','Nasabah & KYC'],['transactions','Riwayat Transaksi'],['booking','Booking & Waiting List'],['closing','Closing Harian'],['accounting','Accounting & Buku Besar'],['compliance','Compliance'],['documents','Document Center'],['numismatic','Numismatic / Old Money'],['settings','Settings']];let state={page:'dashboard'};function call(name,args={}){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[name](args))}function init(){document.getElementById('nav').innerHTML=MENU.map(([id,n])=>'<button id="n-'+id+'" onclick="showPage(\''+id+'\')">'+n+'</button>').join('');showPage('dashboard')}function showPage(p){state.page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('n-'+p)?.classList.add('active');document.getElementById('title').textContent=MENU.find(x=>x[0]===p)?.[1]||p;loadPage()}async function loadPage(){const c=document.getElementById('content');if(state.page==='dashboard'){const r=await call('apiGet',{resource:'dashboard'});c.innerHTML='<div class="cards"><div class="card"><small>Nasabah</small><div class="value">'+r.cards.customers+'</div></div><div class="card"><small>Transaksi</small><div class="value">'+r.cards.transactions+'</div></div><div class="card"><small>Saldo Bank</small><div class="value">'+Number(r.cards.bank_balance).toLocaleString('id-ID')+'</div></div><div class="card"><small>Status</small><div class="value">GS</div></div></div><div class="panel"><h3>Transaksi Terbaru</h3><table><thead><tr><th>No</th><th>Status</th><th>Total</th><th>Waktu</th></tr></thead><tbody>'+r.recent_transactions.map(x=>'<tr><td>'+x.trx_no+'</td><td>'+x.status+'</td><td>'+Number(x.grand_total||0).toLocaleString('id-ID')+'</td><td>'+x.created_at+'</td></tr>').join('')+'</tbody></table></div>'}else if(state.page==='customers'){const r=await call('apiGet',{resource:'customers'});c.innerHTML='<div class="panel"><h3>Nasabah</h3><table><thead><tr><th>Kode</th><th>Nama</th><th>No. KTP</th><th>HP</th></tr></thead><tbody>'+r.data.slice(-100).reverse().map(x=>'<tr><td>'+x.customer_code+'</td><td>'+x.name+'</td><td>'+x.ktp_no+'</td><td>'+x.phone+'</td></tr>').join('')+'</tbody></table></div>'}else if(state.page==='transactions'){const r=await call('apiGet',{resource:'transactions'});c.innerHTML='<div class="panel"><h3>Riwayat Transaksi</h3><table><thead><tr><th>TRX</th><th>Nasabah</th><th>Status</th><th>Total</th></tr></thead><tbody>'+r.data.map(x=>'<tr><td>'+x.trx_no+'</td><td>'+x.customer_id+'</td><td>'+x.status+'</td><td>'+Number(x.grand_total||0).toLocaleString('id-ID')+'</td></tr>').join('')+'</tbody></table></div>'}else{c.innerHTML='<div class="panel"><h3>'+document.getElementById('title').textContent+'</h3><p>Workspace siap dihubungkan ke engine Apps Script pada fase berikutnya. Design shell dipertahankan.</p></div>'}}function refresh(){loadPage()}window.addEventListener('load',init);</script>
