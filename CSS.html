<style>:root{--forest:#0b2a21;--gold:#c8a24a;--paper:#f5f2e9;--ink:#17352c}*{box-sizing:border-box}body{margin:0;font-family:Manrope,Arial,sans-serif;background:var(--paper);color:var(--ink)}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:var(--forest);color:#fff;padding:20px}.brand{font:700 24px Georgia,serif;color:var(--gold);margin-bottom:24px}.nav button{display:block;width:100%;margin:4px 0;padding:11px 12px;text-align:left;background:transparent;border:0;color:#e9eee8;border-radius:8px;cursor:pointer}.nav button.active,.nav button:hover{background:#163c30}.main{padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.card{background:#fff;border:1px solid #ddd6c6;border-radius:12px;padding:18px}.value{font:700 24px 'DM Mono',monospace}.panel{background:#fff;border:1px solid #ddd6c6;border-radius:12px;padding:18px;margin-top:16px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}button.primary{background:var(--gold);border:0;padding:10px 14px;border-radius:8px}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.cards{grid-template-columns:1fr}}</style>
